groups:
  - name: mkideas-availability
    rules:
      - alert: MkIdeasRelayMetricsMissing
        expr: up{job="relay"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: Relay metrics endpoint is unavailable
      - alert: MkIdeasDependencyProbeFailed
        expr: probe_success{job="blackbox"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Health probe failed for {{ $labels.instance }}"
      - alert: MkIdeasPostgresExporterMissing
        expr: up{job="postgres"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: PostgreSQL monitoring is unavailable
      - alert: MkIdeasRedisExporterMissing
        expr: up{job="redis"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Redis monitoring is unavailable
      - alert: MkIdeasPostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) > 40
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: PostgreSQL connection use is near the default pool ceiling
      - alert: MkIdeasRedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85 and redis_memory_max_bytes > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Redis memory use is above 85 percent

